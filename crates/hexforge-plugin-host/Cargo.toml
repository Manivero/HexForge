[package]
name = "hexforge-plugin-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
hexforge-core = { path = "../hexforge-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
wasmtime = { version = "48", features = ["cranelift", "component-model-async", "component-model"] }
wasi = { version = "0.14", features = ["core"] }
anyhow = "1"
