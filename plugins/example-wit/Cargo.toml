[package]
name = "hexforge-example-wit"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.36"

# Standalone template: detached from the HexForge workspace on purpose,
# so `cargo build --target wasm32-wasip1` works from this directory.
[workspace]

# no_std guest: unwind needs an eh_personality lang item that does not
# exist on wasm; abort turns panics into traps the host isolates.
[profile.release]
panic = "abort"
