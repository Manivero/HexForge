<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070b12"/><stop offset="1" stop-color="#111827"/></linearGradient><linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker></defs><rect width="1400" height="520" rx="28" fill="url(#b)"/><text x="70" y="65" fill="#f8fafc" font-family="Inter,Arial" font-size="34" font-weight="700">A pipeline is a graph, not a list</text><text x="70" y="100" fill="#94a3b8" font-family="Inter,Arial" font-size="19">Branch, merge, inspect and reuse transformations as a DAG</text><g font-family="Inter,Arial" text-anchor="middle"><g stroke="#94a3b8" stroke-width="3" fill="none" marker-end="url(#m)"><path d="M240 245H350"/><path d="M500 245H610"/><path d="M760 245H870"/><path d="M1020 245H1130"/><path d="M500 245V355H725"/></g><rect x="80" y="190" width="160" height="95" rx="18" fill="#0b1220" stroke="url(#a)"/><text x="160" y="230" fill="#67e8f9" font-size="22" font-weight="700">INPUT</text><text x="160" y="260" fill="#cbd5e1" font-size="15">file / bytes</text><rect x="350" y="190" width="150" height="95" rx="18" fill="#0b1220" stroke="#334155"/><text x="425" y="230" fill="#e2e8f0" font-size="21" font-weight="700">DECODE</text><text x="425" y="260" fill="#94a3b8" font-size="15">base64 / hex</text><rect x="610" y="190" width="150" height="95" rx="18" fill="#0b1220" stroke="#334155"/><text x="685" y="230" fill="#e2e8f0" font-size="21" font-weight="700">ANALYZE</text><text x="685" y="260" fill="#94a3b8" font-size="15">strings / entropy</text><rect x="870" y="190" width="150" height="95" rx="18" fill="#0b1220" stroke="#334155"/><text x="945" y="230" fill="#e2e8f0" font-size="21" font-weight="700">TRANSFORM</text><text x="945" y="260" fill="#94a3b8" font-size="15">crypto / text</text><rect x="1130" y="190" width="160" height="95" rx="18" fill="#0b1220" stroke="url(#a)"/><text x="1210" y="230" fill="#a78bfa" font-size="22" font-weight="700">OUTPUT</text><text x="1210" y="260" fill="#cbd5e1" font-size="15">inspect / export</text><rect x="725" y="330" width="210" height="95" rx="18" fill="#0b1220" stroke="#475569"/><text x="830" y="370" fill="#e2e8f0" font-size="20" font-weight="700">SIDE BRANCH</text><text x="830" y="400" fill="#94a3b8" font-size="15">hash / diff / report</text></g></svg>